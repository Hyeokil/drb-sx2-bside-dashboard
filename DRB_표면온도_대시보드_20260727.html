  .nav-btn:not(.active-type) { background: transparent; color: #6B7280; }

  .divider { height: 1px; background: #E4E4E7; margin: 6px 0; }

  .month-btn.active-month { background: #FEF2F2; color: #C0392B; font-weight: 600; border-left: 2px solid #C0392B; border-radius: 0 7px 7px 0; padding-left: 8px; }
  .month-btn.active-month.setting { background: #EAF2F8; color: #1A5276; border-left-color: #1A5276; }

  .chart-card { background: #fff; border: 1px solid #E4E4E7; border-radius: 10px; padding: 1rem 1.1rem 0.5rem; }

  .chart-title { font-size: 12px; font-weight: 600; color: #374151; }
  .legend { display: flex; gap: 10px; font-size: 10px; color: #6B7280; flex-wrap: wrap; }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .leg-solid { width: 14px; height: 2px; display: inline-block; border-radius: 1px; }
  .leg-dash  { width: 14px; height: 0; display: inline-block; border-top: 2px dashed; }
  .chart-wrap { position: relative; height: 200px; }
  .change-bar { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 2px 4px; min-height: 28px; border-top: 0.5px solid #F0F0F0; margin-top: 4px; }
  .change-tag { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 500; white-space: nowrap; }
  .change-tag.up   { background: #FDEDEC; color: #C0392B; border: 1px solid #F1948A; }
  .change-tag.down { background: #EBF5FB; color: #1A5276; border: 1px solid #85C1E9; }
  .change-tag.change { background: #FEF9EC; color: #856404; border: 1px solid #F5C842; }
  .setting-wrap { display: flex; flex-direction: column; gap: 16px; }
  .setting-card { background: #fff; border: 1px solid #E4E4E7; border-radius: 10px; overflow: hidden; }
  .setting-card-header { background: #1A5276; color: #fff; padding: 10px 16px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .setting-card-header .sub { font-size: 11px; font-weight: 400; opacity: 0.8; }
  .setting-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .setting-table th { background: #2C3E50; color: #fff; padding: 8px 12px; text-align: center; font-weight: 500; white-space: nowrap; }
  .setting-table th.machine { background: #1A5276; font-size: 11px; }
  .setting-table td { padding: 7px 12px; border-bottom: 0.5px solid #E4E4E7; color: #374151; }
  .setting-table td.label { font-weight: 600; color: #1A5276; background: #EAF2F8; white-space: nowrap; min-width: 90px; }
  .setting-table td.sublabel { color: #6B7280; background: #F8FAFB; padding-left: 20px; }
  .setting-table tr:last-child td { border-bottom: none; }
  .setting-table tr:hover td { background: #F8FAFB; }
  .setting-table tr:hover td.label { background: #D6EAF8; }
  .note { font-size: 10px; color: #E67E22; margin-top: 2px; }
  @media (max-width: 900px) { .stats-row { grid-template-columns: repeat(4,1fr); } .charts-grid { grid-template-columns: 1fr; } }
</style>

  '5월':{ machines:['압출 3호 (SX2)','압출 5호 (LX3, RG3)','압출 6호 (JW1, DL3)'], sections:[{label:'압출조건',sub:'헤드',values:['50℃','45℃','55℃']},{label:'110Φ',sub:'실린더1~3',values:['50℃','45℃','45℃']},{label:'110Φ',sub:'스크류',values:['50℃','45℃','45℃']},{label:'90Φ',sub:'실린더1~3',values:['45℃','//','//']},{label:'90Φ',sub:'스크류',values:['45℃','//','//']},{label:'S.Oven',sub:'#1~3',values:['50%, 50%, 50%','50%, 50%, 50%','//']},{label:'S.Oven',sub:'#4~6',values:['50%, 80%, 80%','98%, 20%, 98%','50%, 60%, 60%']},{label:'S.Oven',sub:'#7~8',values:['80%, 80%','50%, 50%','50%, 50%, 50%']},{label:'UHF',sub:'마그네트론 #1~4',values:['60%','45%','55%']},{label:'UHF',sub:'마그네트론 #5~6',values:['60%','-','-']},{label:'UHF',sub:'온도',values:['210℃','260℃','250℃']},{label:'HAT',sub:'HAT1',values:['230℃','260℃','240℃']},{label:'HAT',sub:'HAT2',values:['250℃','270℃','240℃']},{label:'HAT',sub:'HAT3',values:['250℃','280℃','250℃']},{label:'HAT',sub:'HAT4',values:['260℃','280℃','250℃']},{label:'냉각',sub:'',values:['10℃','10℃','10℃']}], notes:['직수 투입 적용'] },
  '6월':{ machines:['압출 3호 (SX2)','압출 5호 (LX3, RG3)','압출 6호 (JW1, DL3)'], sections:[{label:'압출조건',sub:'헤드',values:['45℃','45℃','55℃']},{label:'110Φ',sub:'실린더1~3',values:['45℃','45℃','45℃']},{label:'110Φ',sub:'스크류',values:['45℃','45℃','45℃']},{label:'90Φ',sub:'실린더1~3',values:['40℃','//','//']},{label:'90Φ',sub:'스크류',values:['40℃','//','//']},{label:'S.Oven',sub:'#1~3',values:['50%, 50%, 50%','50%, 50%, 50%','//']},{label:'S.Oven',sub:'#4~6',values:['50%, 80%, 80%','98%, 20%, 98%','50%, 60%, 60%']},{label:'S.Oven',sub:'#7~8',values:['80%, 80%','50%, 50%','50%, 50%, 50%']},{label:'UHF',sub:'마그네트론 #1~4',values:['60%','45%','55%']},{label:'UHF',sub:'마그네트론 #5~6',values:['60%','-','-']},{label:'UHF',sub:'온도',values:['210℃','260℃','250℃']},{label:'HAT',sub:'HAT1',values:['230℃','260℃','240℃']},{label:'HAT',sub:'HAT2',values:['260℃','270℃','240℃']},{label:'HAT',sub:'HAT3',values:['260℃','280℃','250℃']},{label:'HAT',sub:'HAT4',values:['270℃','280℃','250℃']},{label:'냉각',sub:'',values:['10℃','10℃','10℃']}], notes:['6/19 헤드, 110Φ 실린더1~3, 스크류 5℃ 하강 (3호기)','3호기 90Φ 실린더1~3, 스크류 5℃ 하강','6/22~ HAT #2,3,4 +10℃ 상승','6/29 110Φ 스크류 교체 (온도 변동 확인 중)'] },
  '7월':{ machines:['압출 3호 (SX2)','압출 5호 (LX3, RG3)','압출 6호 (JW1, DL3)'], sections:[
  {label:'압출조건',sub:'헤드',values:['45℃','45℃','55℃']},
  {label:'110Φ',sub:'실린더1~3',values:['45℃','45℃','45℃']},
  {label:'110Φ',sub:'스크류',values:['45℃','45℃','45℃']},
  {label:'90Φ',sub:'실린더1~3',values:['40℃','//','//']},
  {label:'90Φ',sub:'스크류',values:['40℃','//','//']},
  {label:'S.Oven',sub:'#1~3',values:['50%, 50%, 50%','50%, 50%, 50%','//']},
  {label:'S.Oven',sub:'#4~6',values:['50%, 80%, 80%','98%, 20%, 98%','50%, 60%, 60%']},
  {label:'S.Oven',sub:'#7~8',values:['80%, 80%','50%, 50%','50%, 50%, 50%']},
  {label:'UHF',sub:'마그네트론 #1~4',values:['60%','45%','55%']},
  {label:'UHF',sub:'마그네트론 #5~6',values:['60%','-','-']},
  {label:'UHF',sub:'온도',values:['210℃','260℃','250℃']},
  {label:'HAT',sub:'HAT1',values:['230℃','260℃','240℃']},
  {label:'HAT',sub:'HAT2',values:['260℃','270℃','240℃']},
  {label:'HAT',sub:'HAT3',values:['260℃','280℃','250℃']},
  {label:'HAT',sub:'HAT4',values:['270℃','280℃','250℃']},
  {label:'냉각',sub:'',values:['10℃','10℃','10℃']}
  ], notes:['6월과 동일 조건 유지','6/29 110Φ 스크류 교체 반영','7/27 90Φ 스크류 교체 (스펀지)'] },
};

const SETTING_MONTHS=['1월','2월','3월','4월','5월','6월','7월'];
const CHART_DEFS=[
  {id:'ch1',title:'헤드 표면온도 (°C)',sets:[{label:'헤드',key:'head',color:'#C0392B',dash:[]}]},
  {id:'ch2',title:'S/OVEN & UHF 공정온도 (°C)',sets:[{label:'S/OVEN',key:'soven',color:'#E67E22',dash:[]},{label:'UHF',key:'uhf',color:'#1ABC9C',dash:[5,3]}]},
  {id:'ch3',title:'HAT #1 & #2 공정온도 (°C)',sets:[{label:'HAT #1',key:'hat1',color:'#2C3E8C',dash:[]},{label:'HAT #2',key:'hat2',color:'#5B9BD5',dash:[5,3]}]},
  {id:'ch4',title:'HAT #3 & #4 공정온도 (°C)',sets:[{label:'HAT #3',key:'hat3',color:'#27AE60',dash:[]},{label:'HAT #4',key:'hat4',color:'#8E44AD',dash:[5,3]}]},
];

let curType='solid', curMonth='all', activeCharts=[];

function getFiltered(type,month){
  const indices=month==='all'?ALL_MONTHS.map((_,i)=>i):ALL_MONTHS.map((m,i)=>m===parseInt(month)?i:-1).filter(i=>i>=0);
  const data={};
  Object.keys(RAW[type]).forEach(k=>{data[k]=indices.map(i=>RAW[type][k][i]);});
  return{dates:indices.map(i=>ALL_DATES[i]),data,count:indices.length};
}
function avg(a){return a&&a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):'-';}
function minV(a){return a&&a.length?Math.min(...a).toFixed(1):'-';}
function maxV(a){return a&&a.length?Math.max(...a).toFixed(1):'-';}

function buildStats(data){
  const keys=['head','soven','uhf','hat1','hat2','hat3','hat4'];
  const labels=['헤드','S/OVEN','UHF','HAT #1','HAT #2','HAT #3','HAT #4'];
  document.getElementById('stats-row').innerHTML=keys.map((k,i)=>`
    <div class="stat"><div class="stat-label">${labels[i]} 평균</div>
    <div class="stat-value">${avg(data[k])}°C</div>
    <div class="stat-sub">최저 ${minV(data[k])} / 최고 ${maxV(data[k])}</div></div>`).join('');
}

function getChangesForDates(dates){return CHANGES.filter(c=>dates.includes(c.nearDate));}
function changeBarHTML(dates){
  const matched=getChangesForDates(dates);
  if(!matched.length) return '';
  return`<div class="change-bar">${matched.map(c=>`<span class="change-tag ${c.dir}">${c.dir==='up'?'▲':c.dir==='down'?'▼':'🔧'} ${c.date} ${c.label}</span>`).join('')}</div>`;
}
function minMaxIdx(arr){let mi=0,xi=0;arr.forEach((v,i)=>{if(v<arr[mi])mi=i;if(v>arr[xi])xi=i;});return{minI:mi,maxI:xi};}

function buildCharts(dates,data){
  activeCharts.forEach(c=>c.destroy());activeCharts=[];
  const grid=document.getElementById('main-content');
  grid.className='charts-grid';grid.innerHTML='';
  CHART_DEFS.forEach(ch=>{
    const legHTML=ch.sets.map(s=>`<span>${s.dash.length?`<span class="leg-dash" style="border-color:${s.color};"></span>`:`<span class="leg-solid" style="background:${s.color};"></span>`}${s.label}</span>`).join('');
    grid.innerHTML+=`<div class="chart-card"><div class="chart-header"><span class="chart-title">${ch.title}</span><div class="legend">${legHTML}</div></div><div class="chart-wrap"><canvas id="${ch.id}"></canvas></div>${changeBarHTML(dates)}</div>`;
  });
  CHART_DEFS.forEach(ch=>{
    const allVals=ch.sets.flatMap(s=>data[s.key]||[]);
    const yMin=Math.floor(Math.min(...allVals)-8),yMax=Math.ceil(Math.max(...allVals)+8);
    const datasets=ch.sets.map(s=>{
      const arr=data[s.key]||[];const{minI,maxI}=minMaxIdx(arr);
      return{label:s.label,data:arr,borderColor:s.color,backgroundColor:'transparent',tension:0.3,
        pointRadius:arr.map((_,i)=>(i===minI||i===maxI)?5:2.5),
        pointBackgroundColor:arr.map((_,i)=>(i===minI||i===maxI)?'#fff':s.color),
        pointBorderColor:s.color,pointBorderWidth:arr.map((_,i)=>(i===minI||i===maxI)?2:0),
        borderDash:s.dash,borderWidth:2,
        datalabels:{
          display:ctx=>{const i=ctx.dataIndex;return i===minI||i===maxI;},
          formatter:(val,ctx)=>{const i=ctx.dataIndex;return`${i===maxI?'▲':'▼'} ${val.toFixed(1)}`;},
          color:ctx=>ctx.dataIndex===maxI?'#C0392B':'#2980B9',
          font:{size:10,weight:'600'},
          anchor:ctx=>ctx.dataIndex===maxI?'end':'start',
          align:ctx=>ctx.dataIndex===maxI?'top':'bottom',
          offset:4,backgroundColor:'rgba(255,255,255,0.85)',borderRadius:3,
          padding:{top:2,bottom:2,left:4,right:4},
        }};
    });
    const inst=new Chart(document.getElementById(ch.id),{
      type:'line',data:{labels:dates,datasets},
      plugins:[{id:'changeLines',afterDraw(chart){
        const ctx2=chart.ctx,xScale=chart.scales.x,yScale=chart.scales.y;
        CHANGES.forEach(c=>{
          const idx=dates.indexOf(c.nearDate);if(idx<0)return;
          const x=xScale.getPixelForValue(idx);
          ctx2.save();ctx2.setLineDash([4,3]);
          ctx2.strokeStyle=c.dir==='up'?'rgba(192,57,43,0.5)':c.dir==='down'?'rgba(26,82,118,0.5)':'rgba(133,100,4,0.5)';
          ctx2.lineWidth=1.5;ctx2.beginPath();ctx2.moveTo(x,yScale.top);ctx2.lineTo(x,yScale.bottom);ctx2.stroke();
          ctx2.setLineDash([]);ctx2.fillStyle=c.dir==='up'?'#C0392B':c.dir==='down'?'#1A5276':'#856404';
          ctx2.font='bold 9px sans-serif';ctx2.textAlign='center';
          ctx2.fillText(c.dir==='up'?'▲':c.dir==='down'?'▼':'🔧',x,yScale.top+10);ctx2.restore();
        });
      }}],
      options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:22,bottom:18}},
        plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${c.parsed.y.toFixed(1)}°C`}},datalabels:{}},
        scales:{x:{grid:{display:false},ticks:{font:{size:10},color:'#9CA3AF',maxRotation:45,autoSkip:true,maxTicksLimit:14}},
          y:{min:yMin,max:yMax,grid:{color:'rgba(0,0,0,0.05)'},ticks:{font:{size:10},color:'#9CA3AF',callback:v=>v+'°C'}}}}
    });
    activeCharts.push(inst);
  });
}

function buildSettingTable(month){
  const d=SETTING[month];
  if(!d) return`<div style="padding:2rem;color:#9CA3AF;">데이터 없음</div>`;
  const thM=d.machines.map(m=>`<th class="machine">${m}</th>`).join('');
  let prev='';
  const rows=d.sections.map(s=>{
    const isFirst=s.label!==prev;prev=s.label;
    const span=d.sections.filter(x=>x.label===s.label).length;
    const lc=isFirst?`<td class="label" rowspan="${span}">${s.label}</td>`:'';
    const vc=s.values.map(v=>`<td style="text-align:center;">${v}</td>`).join('');
    const ec=Array(d.machines.length-s.values.length).fill('<td style="text-align:center;">-</td>').join('');
    return`<tr>${lc}<td class="sublabel">${s.sub}</td>${vc}${ec}</tr>`;
  }).join('');
  const notes=d.notes.length?`<div style="padding:10px 16px;background:#FFFBF0;border-top:1px solid #E4E4E7;">${d.notes.map(n=>`<div class="note">📌 ${n}</div>`).join('')}</div>`:'';
  return`<div class="setting-card"><div class="setting-card-header">📋 ${month} 온도 셋팅조건 <span class="sub">압출공정 설비 조건</span></div><div style="overflow-x:auto;"><table class="setting-table"><thead><tr><th>구분</th><th>항목</th>${thM}</tr></thead><tbody>${rows}</tbody></table></div>${notes}</div>`;
}

function buildSettingView(month){
  activeCharts.forEach(c=>c.destroy());activeCharts=[];
  document.getElementById('stats-row').innerHTML='';
  const content=document.getElementById('main-content');
  content.className='setting-wrap';
  content.innerHTML=month==='all'?SETTING_MONTHS.map(m=>buildSettingTable(m)).join(''):buildSettingTable(month+'월');
}

function rebuildMonthButtons(){
  const container=document.getElementById('month-btns');
  if(curType==='setting'){
    container.innerHTML=`<button class="month-btn ${curMonth==='all'?'active-month setting':''}" onclick="setMonth('all',this)">전체 현황</button>`;
    [1,2,3,4,5,6,7].forEach(m=>{
      const b=document.createElement('button');
      b.className='month-btn'+(String(m)===String(curMonth)?' active-month setting':'');
      b.textContent=`${m}월`;b.onclick=function(){setMonth(String(m),this);};container.appendChild(b);
    });
  } else {
    const months=[...new Set(ALL_MONTHS)].sort((a,b)=>a-b);
    container.innerHTML=`<button class="month-btn ${curMonth==='all'?'active-month':''}" onclick="setMonth('all',this)">전체 현황</button>`;
    months.forEach(m=>{
      const b=document.createElement('button');
      b.className='month-btn'+(String(m)===String(curMonth)?' active-month':'');
      b.textContent=`${m}월`;b.onclick=function(){setMonth(String(m),this);};container.appendChild(b);
    });
  }
}

function render(){
  if(curType==='setting'){
    const mn=curMonth==='all'?'전체 현황':curMonth+'월';
    document.getElementById('tab-title').textContent=`온도 셋팅조건 — ${mn}`;
    document.getElementById('date-badge').textContent='압출 공정 설비 조건 (1월~6월)';
    buildSettingView(curMonth);
  } else {
    const tn=curType==='solid'?'솔리드부':'스펀지부';
    const mn=curMonth==='all'?'전체 현황':curMonth+'월';
    document.getElementById('tab-title').textContent=`${tn} 표면온도 — ${mn}`;
    const{dates,data,count}=getFiltered(curType,curMonth);
    const f=dates[0]||'',l=dates[dates.length-1]||'';
    document.getElementById('date-badge').textContent=`${f} ~ ${l} (${count}회 측정)`;
    buildStats(data);buildCharts(dates,data);
  }
}

function setType(type,btn){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active-type'));
  btn.classList.add('active-type');curType=type;curMonth='all';rebuildMonthButtons();render();
}
function setMonth(month,btn){
  document.querySelectorAll('.month-btn').forEach(b=>b.classList.remove('active-month','setting'));
  btn.classList.add('active-month');if(curType==='setting')btn.classList.add('setting');
  curMonth=month;render();
}

rebuildMonthButtons();render();
</script>
